name: Compress product photos

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
      - 'scripts/compress-images.py'
      - '.github/workflows/compress-images.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: compress-product-photos-main
  cancel-in-progress: false

jobs:
  compress:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install image tools
        run: python -m pip install --disable-pip-version-check Pillow==12.1.1
      - name: Compress photos and publish updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/compress-images.py
            if git diff --quiet; then
              echo 'Photos and cache versions are already up to date.'
              exit 0
            fi
            git add -- images app.js '*.html'
            git commit -m 'Compress product photos and refresh image cache'
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Main changed during compression. Retrying ($attempt/3)."
          done
          echo 'Could not publish compressed photos after three attempts.' >&2
          exit 1
